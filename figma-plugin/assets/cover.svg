<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141021"/><stop offset="1" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="g" x1="140" y1="300" x2="500" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c7b6ff"/><stop offset="1" stop-color="#f3a6cf"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="960" fill="url(#bg)"/>

  <!-- logo mark -->
  <g transform="translate(150 330) scale(4.4)">
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#g)" stroke-width="3.4"/>
    <g fill="none" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36.27 22.41 L42.44 30.9 L38.17 40.49 L27.73 41.59 L21.56 33.1 L25.83 23.51 Z"/>
      <line x1="32" y1="7" x2="36.27" y2="22.41"/><line x1="53.65" y1="19.5" x2="42.44" y2="30.9"/><line x1="53.65" y1="44.5" x2="38.17" y2="40.49"/><line x1="32" y1="57" x2="27.73" y2="41.59"/><line x1="10.35" y1="44.5" x2="21.56" y2="33.1"/><line x1="10.35" y1="19.5" x2="25.83" y2="23.51"/>
    </g>
    <circle cx="32" cy="32" r="4" fill="url(#g)"/>
  </g>

  <!-- wordmark + copy -->
  <text x="470" y="410" font-family="Lato" font-weight="700" font-size="104" fill="#ffffff">Pik</text>
  <text x="609" y="410" font-family="Lato" font-weight="700" font-size="104" fill="url(#tg)">Finder</text>
  <text x="474" y="470" font-family="Lato" font-weight="600" font-size="40" fill="#9aa0b4">Free stock media — right inside Figma</text>
  <text x="474" y="560" font-family="Lato" font-weight="400" font-size="30" fill="#7a8099">Search millions of free, copyright-safe photos and videos,</text>
  <text x="474" y="602" font-family="Lato" font-weight="400" font-size="30" fill="#7a8099">then click to drop one straight onto your canvas.</text>

  <!-- decorative photo tiles -->
  <g>
    <rect x="1250" y="250" width="200" height="260" rx="18" fill="#6d5ae6"/>
    <rect x="1470" y="220" width="200" height="200" rx="18" fill="#3aa0a0"/>
    <rect x="1250" y="530" width="200" height="180" rx="18" fill="#e2748f"/>
    <rect x="1470" y="440" width="200" height="270" rx="18" fill="#e0a54a"/>
    <rect x="1690" y="300" width="150" height="360" rx="18" fill="#4f7cff"/>
  </g>

  <text x="474" y="700" font-family="Lato" font-weight="600" font-size="26" fill="#8b5cf6">pikfinder.com</text>
</svg>
