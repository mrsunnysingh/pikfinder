  <script type="application/ld+json">

      "@context": "https://schema.org",

        {
          "@type": "WebApplication",
          "name": "PikFinder",
          "alternateName": ["Pik Finder", "Pikfinder", "PikFinder Studio", "PikFinder.com"],

          "url": "https://www.pikfinder.com/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.pikfinder.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "name": "PikFinder",
          "alternateName": ["Pik Finder", "Pikfinder", "PikFinder Studio"],
          "url": "https://www.pikfinder.com/",

          "description": "PikFinder is a free web-based platform for finding copyright-safe stock media and creating designs in the browser with PikFinder Studio.",

            "https://www.linkedin.com/company/pikfinder/",
            "https://x.com/pikfinder",
            "https://facebook.com/Pikfinder"
          ]
        }
      ]
