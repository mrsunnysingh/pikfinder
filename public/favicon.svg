<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pik Finder">
  <defs>
    <linearGradient id="pfGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 32 32" to="360 32 32" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="pfGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#0b0b18"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#pfGlow)"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.25" fill="none" stroke="url(#pfGrad)" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- outer ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#pfGrad)" stroke-width="3.4"/>

  <!-- rotating scan highlight -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.4"
          stroke-linecap="round" stroke-dasharray="22.7 140.7">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- iris (rotates slowly) -->
  <g fill="none" stroke="url(#pfGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="26s" repeatCount="indefinite"/>
    <path d="M36.27 22.41 L42.44 30.9 L38.17 40.49 L27.73 41.59 L21.56 33.1 L25.83 23.51 Z"/>
    <line x1="32.0" y1="7.0" x2="36.27" y2="22.41"/>
    <line x1="53.65" y1="19.5" x2="42.44" y2="30.9"/>
    <line x1="53.65" y1="44.5" x2="38.17" y2="40.49"/>
    <line x1="32.0" y1="57.0" x2="27.73" y2="41.59"/>
    <line x1="10.35" y1="44.5" x2="21.56" y2="33.1"/>
    <line x1="10.35" y1="19.5" x2="25.83" y2="23.51"/>
  </g>

  <!-- center pulse -->
  <circle cx="32" cy="32" r="4" fill="url(#pfGrad)">
    <animate attributeName="r" values="3.4;5;3.4" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
